<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24583D" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#102C22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A1C16"/>
    </radialGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6B4B"/>
      <stop offset="40%" stop-color="#102C22"/>
      <stop offset="100%" stop-color="#0A1C16"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E9E1CC"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#8C7355"/>
    </linearGradient>
    <linearGradient id="bioCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A6C96A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C8EE88" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Studio Backdrop -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Pedestal Shadow & Ambient Ring -->
  <ellipse cx="400" cy="680" rx="220" ry="35" fill="#05100C" opacity="0.8"/>
  <ellipse cx="400" cy="675" rx="160" ry="18" fill="#A6C96A" opacity="0.25" filter="url(#glow)"/>

  <!-- Glowing Bio-Nutrient Ambient Aura -->
  <circle cx="400" cy="420" r="140" fill="#A6C96A" opacity="0.18" filter="url(#glow)"/>

  <!-- Flagship Bottle Geometry -->
  <!-- Main Bottle Body -->
  <rect x="280" y="280" width="240" height="360" rx="36" fill="url(#glassBody)" stroke="#A6C96A" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Active Inner Serum Core -->
  <rect x="305" y="320" width="190" height="290" rx="24" fill="url(#bioCore)"/>
  
  <!-- Specular Reflection Highlight Line -->
  <path d="M 305 310 Q 305 600 305 600" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"/>
  <path d="M 320 310 Q 320 580 320 580" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round"/>

  <!-- Bottle Shoulder -->
  <path d="M 280 300 Q 280 250 350 240 L 450 240 Q 520 250 520 300 Z" fill="url(#glassBody)" stroke="#A6C96A" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Gold Neck Ring -->
  <rect x="360" y="215" width="80" height="25" rx="4" fill="url(#goldCap)" stroke="#E9E1CC" stroke-width="1"/>

  <!-- Precision Gold Cap with Knurling -->
  <rect x="350" y="140" width="100" height="75" rx="8" fill="url(#goldCap)"/>
  <!-- Cap knurled grooves -->
  <line x1="365" y1="145" x2="365" y2="210" stroke="#8C7355" stroke-width="2"/>
  <line x1="380" y1="145" x2="380" y2="210" stroke="#8C7355" stroke-width="2"/>
  <line x1="395" y1="145" x2="395" y2="210" stroke="#8C7355" stroke-width="2"/>
  <line x1="410" y1="145" x2="410" y2="210" stroke="#8C7355" stroke-width="2"/>
  <line x1="425" y1="145" x2="425" y2="210" stroke="#8C7355" stroke-width="2"/>

  <!-- Label Plaque -->
  <rect x="320" y="380" width="160" height="170" rx="16" fill="#0A1C16" fill-opacity="0.92" stroke="#C5A880" stroke-width="1.5"/>

  <!-- AGROVÉ Leaf Emblem on Label -->
  <path d="M 400 405 C 420 405 435 420 435 440 C 435 460 415 475 385 475 C 385 455 385 430 400 405 Z" fill="#C5A880"/>
  <path d="M 392 460 C 405 455 418 445 422 432" stroke="#0A1C16" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Label Typography -->
  <text x="400" y="500" font-family="serif" font-size="16" font-weight="bold" fill="#E9E1CC" text-anchor="middle" letter-spacing="2">AGROVÉ</text>
  <text x="400" y="520" font-family="sans-serif" font-size="9" font-weight="bold" fill="#A6C96A" text-anchor="middle" letter-spacing="1.5">TERRACORE™</text>
  <text x="400" y="535" font-family="sans-serif" font-size="8" fill="#C5A880" text-anchor="middle" letter-spacing="0.5">BIO-ACTIVE REGENERATOR</text>

  <!-- Suspended Bio-Spore Particles -->
  <circle cx="340" cy="350" r="3" fill="#E9E1CC" opacity="0.8"/>
  <circle cx="450" cy="360" r="2.5" fill="#FFE7BA" opacity="0.9"/>
  <circle cx="330" cy="580" r="3.5" fill="#C8EE88" opacity="0.7"/>
  <circle cx="465" cy="570" r="2" fill="#E9E1CC" opacity="0.8"/>
  <circle cx="475" cy="460" r="4" fill="#A6C96A" opacity="0.6"/>
  <circle cx="315" cy="470" r="3" fill="#FFE7BA" opacity="0.7"/>
</svg>

