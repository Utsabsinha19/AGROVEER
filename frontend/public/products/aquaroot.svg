<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E3D3C" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#102C22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A1C16"/>
    </radialGradient>
    <linearGradient id="pailBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183F31"/>
      <stop offset="50%" stop-color="#102C22"/>
      <stop offset="100%" stop-color="#081813"/>
    </linearGradient>
    <linearGradient id="aquaGel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow3)"/>
  <ellipse cx="400" cy="690" rx="230" ry="38" fill="#040D0A" opacity="0.85"/>
  <ellipse cx="400" cy="680" rx="160" ry="20" fill="#38BDF8" opacity="0.25" filter="url(#glow3)"/>

  <!-- Heavy Duty Granular Pail / Tub -->
  <!-- Tub Body -->
  <path d="M 260 340 L 290 640 Q 290 660 320 660 L 480 660 Q 510 660 510 640 L 540 340 Z" fill="url(#pailBody)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Pail Rim / Lid Assembly -->
  <ellipse cx="400" cy="340" rx="140" ry="35" fill="#1C241F" stroke="#C5A880" stroke-width="3"/>
  <ellipse cx="400" cy="335" rx="135" ry="30" fill="url(#pailBody)"/>

  <!-- Gel Moisture Window -->
  <rect x="310" y="420" width="180" height="150" rx="18" fill="url(#aquaGel)"/>
  <!-- Hydro-retention particles -->
  <circle cx="340" cy="460" r="8" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="450" cy="480" r="12" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="390" cy="510" r="9" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="420" cy="445" r="6" fill="#FFFFFF" opacity="0.8"/>

  <!-- Handle Metal Wire Arc -->
  <path d="M 255 350 Q 220 220 400 200 Q 580 220 545 350" fill="none" stroke="#C5A880" stroke-width="5" stroke-linecap="round"/>
  <rect x="370" y="190" width="60" height="20" rx="6" fill="#0A1C16" stroke="#C5A880" stroke-width="1.5"/>

  <!-- Label Banner -->
  <rect x="325" y="470" width="150" height="110" rx="12" fill="#0A1C16" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="400" y="505" font-family="serif" font-size="15" font-weight="bold" fill="#E9E1CC" text-anchor="middle" letter-spacing="1">AGROVÉ</text>
  <text x="400" y="525" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">AQUAROOT™</text>
  <text x="400" y="542" font-family="sans-serif" font-size="7" fill="#C5A880" text-anchor="middle">HYDRO-MATRIX POLYMER</text>
</svg>

