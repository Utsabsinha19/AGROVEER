<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#183F31" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#102C22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A1C16"/>
    </radialGradient>
    <linearGradient id="shieldBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20513F"/>
      <stop offset="50%" stop-color="#102C22"/>
      <stop offset="100%" stop-color="#081813"/>
    </linearGradient>
    <linearGradient id="emeraldLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow2)"/>
  <ellipse cx="400" cy="680" rx="210" ry="32" fill="#040D0A" opacity="0.85"/>
  <ellipse cx="400" cy="675" rx="140" ry="16" fill="#34D399" opacity="0.25" filter="url(#glow2)"/>

  <!-- Botanical Shield Emblem in background -->
  <path d="M 400 180 Q 550 220 520 460 Q 480 620 400 660 Q 320 620 280 460 Q 250 220 400 180 Z" fill="none" stroke="#34D399" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Bottle Body: Sleek Ergonomic Flagon -->
  <path d="M 310 320 Q 300 480 320 620 L 480 620 Q 500 480 490 320 Q 450 260 430 240 L 370 240 Q 350 260 310 320 Z" fill="url(#shieldBody)" stroke="#34D399" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Inner Bio-Foliar Liquid Core -->
  <path d="M 325 350 Q 318 480 335 600 L 465 600 Q 482 480 475 350 Q 445 300 425 280 L 375 280 Q 355 300 325 350 Z" fill="url(#emeraldLiquid)"/>

  <!-- Specular Reflection -->
  <path d="M 335 340 Q 330 480 340 580" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round"/>

  <!-- Atomizer Spray Collar / Dispenser -->
  <rect x="375" y="210" width="50" height="30" rx="4" fill="#C5A880"/>
  <rect x="365" y="160" width="70" height="50" rx="8" fill="#1C241F" stroke="#C5A880" stroke-width="1.5"/>
  <!-- Spray Nozzle Tip -->
  <path d="M 365 175 L 340 178 L 340 192 L 365 195 Z" fill="#C5A880"/>

  <!-- Label Badge -->
  <rect x="330" y="400" width="140" height="150" rx="14" fill="#0A1C16" fill-opacity="0.92" stroke="#34D399" stroke-width="1.5"/>
  <path d="M 400 420 L 425 435 L 425 460 Q 400 485 400 485 Q 400 485 375 460 L 375 435 Z" fill="#34D399" fill-opacity="0.3" stroke="#34D399" stroke-width="2"/>
  <text x="400" y="505" font-family="serif" font-size="14" font-weight="bold" fill="#E9E1CC" text-anchor="middle" letter-spacing="1">AGROVÉ</text>
  <text x="400" y="525" font-family="sans-serif" font-size="9" font-weight="bold" fill="#34D399" text-anchor="middle" letter-spacing="1.5">PHYTOSHIELD™</text>
  <text x="400" y="538" font-family="sans-serif" font-size="7" fill="#C5A880" text-anchor="middle">BOTANICAL DEFENSE</text>
</svg>

